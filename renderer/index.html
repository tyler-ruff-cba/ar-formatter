<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <title>AR FORMATTER - CBA Utils</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="container">

        <h1>
            A/R Formatter
        </h1>

        <form>
            <fieldset>
                <legend>Upload File</legend>
                <div class="file-upload-section">
                    <input 
                        type="text"
                        id="uploadedFilePath"
                        value="Please select a file..."
                        readonly
                        name="uploadedFilePath"
                        class="file-upload-path"
                    />
                    <input 
                        type="button"
                        id="fileUpload"
                        value="Upload File"
                        class="file-upload-btn"
                    />
                </div>
            </fieldset>
            <fieldset>
                <legend>Set Date Range</legend>
                <input
                    type="text"
                    id="dateRanges"
                    placeholder="5/2026,6/2026,7/2026"
                    class="date-range-input"
                />
            </fieldset>

            <input 
                type="button"
                value="Start Process"
                id="submitBtn"
            />
            
            <button
                id="downloadBtn"
                style="display:none;"
            >
                Download Processed File
            </button>

        </form>

        <div id="status"></div>

    </div>

    <script src="./renderer.js"></script>

</body>
</html>
