name: Build & Release Electron App

on:
  push:
    branches:
      - main
      - release/*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Electron App
        run: npm run dist

      - name: Collect Release Files
        shell: bash
        run: |
          mkdir release-files

          if [ "${{ matrix.platform }}" = "windows" ]; then
            find dist -name "*.exe" -exec cp {} release-files/ \;
            find dist -name "*.msi" -exec cp {} release-files/ \;
          fi

          if [ "${{ matrix.platform }}" = "macos" ]; then
            find dist -name "*.dmg" -exec cp {} release-files/ \;
            find dist -name "*.zip" -exec cp {} release-files/ \;
          fi

          if [ "${{ matrix.platform }}" = "linux" ]; then
            find dist -name "*.AppImage" -exec cp {} release-files/ \;
            find dist -name "*.deb" -exec cp {} release-files/ \;
          fi

      - name: Rename Release Files
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            for f in release-files/*.exe; do
              mv "$f" "release-files/AR-Formatter-Windows-x64.exe"
            done
          fi

          if [ "${{ matrix.platform }}" = "macos" ]; then
            for f in release-files/*.dmg; do
              mv "$f" "release-files/AR-Formatter-macOS-x64.dmg"
            done
          fi

          if [ "${{ matrix.platform }}" = "linux" ]; then
            for f in release-files/*.AppImage; do
              mv "$f" "release-files/AR-Formatter-Linux-x64.AppImage"
            done
          fi

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: release-files/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Version From package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Generate Release Notes
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          # Downloads

          ## Windows
          Download the .exe installer.

          ## macOS
          Download the .dmg installer.

          ## Linux
          Download the .AppImage or .deb package.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: AR Formatter v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/windows/*
            release-assets/macos/*
            release-assets/linux/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}